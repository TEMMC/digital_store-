name: Build MT Digital Store APK

on:
  push:
    branches: [mt-digital-store-android]
    paths:
      - "app/**"
      - "templates/**"
      - "static/**"
      - "app.py"
      - "requirements.txt"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-mt-digital-store-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set Chaquopy build Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT-Digital-Store-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
