{% extends "base.html" %}{% block content %}<section class="auth-panel wide-panel"><span class="eyebrow">CREATOR STUDIO · NEW LISTING</span><h1>Publish a product.</h1><p>Upload a digital file directly from this device or add a secure HTTPS link.</p><form method="POST" enctype="multipart/form-data"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Product name</label><input name="name" maxlength="200" required placeholder="Give your product a clear name"><label>Description</label><textarea name="description" maxlength="10000" rows="6" placeholder="What does it do? Who is it for?"></textarea><label>Category</label><select name="category">{% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select><label>Product file · upload from this phone</label><input type="file" name="file"><p class="form-hint">Maximum 100 MB per upload. Supported: APK, ZIP, PDF, images, audio, video, documents and source files.</p><label>Or external HTTPS download link</label><input type="url" name="file_url" placeholder="https://example.com/product.zip"><label>Product cover image · optional</label><input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif"><label>Or cover image HTTPS URL</label><input type="url" name="image_url" placeholder="https://example.com/cover.jpg"><label>Price (USD)</label><input type="number" name="price" min="0" step="0.01" value="0"><label class="check-label"><input type="checkbox" name="is_free"> List this product as free</label><button class="btn" type="submit">Publish listing ↗</button><a class="secondary-btn" href="/dashboard">Cancel</a></form></section>{% endblock %}
