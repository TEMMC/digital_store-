{% extends "base.html" %}{% block content %}<section class="auth-panel"><span class="eyebrow">CREATOR STUDIO</span><h1>Edit product</h1><p>Refine your listing details.</p><form method="POST"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Product name</label><input name="name" value="{{ product.name }}" maxlength="200" required><label>Description</label><textarea name="description" maxlength="10000">{{ product.description or '' }}</textarea><label>Category</label><select name="category">{% for c in categories %}<option value="{{ c }}" {% if product.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select><label>Price (USD)</label><input type="number" name="price" min="0" step="0.01" value="{{ product.price or 0 }}"><label class="check-label"><input type="checkbox" name="is_free" {% if product.is_free %}checked{% endif %}> This product is free</label><button class="btn" type="submit">Save changes</button><a class="secondary-btn" href="/dashboard">Cancel</a></form></section>{% endblock %}
