{% extends "base.html" %}{% block content %}<section class="auth-panel"><span class="eyebrow">JOIN THE ECOSYSTEM</span><h1>Create your MT account.</h1><p>Discover, collect and publish digital products.</p><form method="POST"><label>Username</label><input name="username" minlength="3" maxlength="40" autocomplete="username" required><label>Email</label><input name="email" type="email" autocomplete="email" required><label>Phone (optional)</label><input name="phone" autocomplete="tel"><label>Password</label><input name="password" type="password" minlength="8" autocomplete="new-password" required><label>Account type</label><select name="role"><option value="buyer">Buyer / Explorer</option><option value="seller">Creator / Seller</option></select><button class="btn" type="submit">Create account ↗</button></form><p class="auth-switch">Already registered? <a href="/login">Sign in</a></p></section>{% endblock %}
