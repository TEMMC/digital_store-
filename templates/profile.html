{% extends "base.html" %}{% block content %}<section class="auth-panel"><span class="eyebrow">ACCOUNT CONTROL CENTER</span><h1>Your profile</h1><p>Manage your account details and security.</p><form method="POST"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Username</label><input value="{{ user.username }}" disabled><label>Email</label><input value="{{ user.email }}" disabled><label>Phone</label><input name="phone" value="{{ user.phone or '' }}"><label>Country</label><input name="country" value="{{ user.country or '' }}"><label>About you</label><textarea name="bio" maxlength="500">{{ user.bio or '' }}</textarea><hr><h3>Change password</h3><label>Current password</label><input type="password" name="current_password" autocomplete="current-password"><label>New password</label><input type="password" name="new_password" minlength="8" autocomplete="new-password"><button class="btn" type="submit">Save profile</button></form></section>{% endblock %}
