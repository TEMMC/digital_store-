services:
  - type: web
    name: mt-digital-store
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MT_HTTPS
        value: "1"
      - key: MT_BIND_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: mt-digital-store-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
    disk:
      name: mt-store-uploads
      mountPath: /var/data
      sizeGB: 1
databases:
  - name: mt-digital-store-db
    plan: basic-256mb
